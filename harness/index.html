<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MxTechiesDraggable harness</title>
<link rel="stylesheet" href="dist/entry.css" />
<style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #fff; }
    .area { position: relative; width: 600px; max-width: 100%; height: 360px; border: 1px solid #ccd; }
    .card { width: 120px; height: 60px; background: #e8f0fe; border: 1px solid #264ae5; box-sizing: border-box; padding: 6px; }
    .zones { display: flex; gap: 12px; margin-top: 16px; }
    .drop-zone { flex: 1; height: 140px; border: 2px dashed #bbc; }
    .tall { height: 2400px; }
    .lists { display: flex; gap: 16px; margin-top: 16px; align-items: flex-start; }
    .sort-list { box-sizing: border-box; width: 200px; min-height: 120px; padding: 8px; border: 1px solid #ccd; display: flex; flex-direction: column; gap: 8px; }
    .sort-list.grid { flex-direction: row; flex-wrap: wrap; width: 400px; }
    .sort-list.row { flex-direction: row; width: 600px; }
    .canvas { position: relative; width: 600px; height: 360px; }
    @media (max-width: 700px) { .area, .sort-list.grid, .sort-list.row { width: 100%; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="dist/entry.js"></script>
</body>
</html>
